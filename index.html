<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stadiums Maintenance Performance Model · Tātaki Auckland Unlimited</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <picture class="brand-logo">
        <source srcset="tau-logo-white.svg" media="(prefers-color-scheme: dark)">
        <img src="tau-logo-navy.svg" alt="Tātaki Auckland Unlimited and Auckland Council">
      </picture>
      <div class="brand-text">
        <div class="brand-name">Stadiums Maintenance Performance Model</div>
        <div class="brand-sub">Schedule 1 · Contract performance assessment</div>
      </div>
    </div>
    <nav class="tabs" aria-label="Sections">
      <a href="#dashboard" data-view="dashboard">Dashboard</a>
      <a href="#events" data-view="events">Events</a>
      <a href="#deductions" data-view="deductions">Monthly</a>
      <a href="#bands" data-view="bands">Bands</a>
      <a href="#model" data-view="model">Model</a>
      <a href="#overview" data-view="overview">Model overview</a>
      <a href="#setup" data-view="setup">Setup</a>
      <a href="#help" data-view="help">Help</a>
    </nav>
    <div class="ctx">
      <select id="contractorSel" aria-label="Contractor"></select>
      <select id="yearSel" aria-label="Contract year"></select>
      <select id="monthSel" aria-label="Month"></select>
    </div>
  </div>
</header>
<main id="app" class="wrap"></main>
<!-- Netlify Forms: lets Netlify detect the Help > Ask a question form at deploy -->
<form name="app-question" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="text" name="bot-field"><input type="text" name="name"><input type="email" name="email"><textarea name="question"></textarea><input type="text" name="context">
</form>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="model.js"></script>
<script src="sample.js"></script>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>

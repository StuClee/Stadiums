<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stadium Performance Model</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <div>
        <div class="brand-name">Stadium Performance Model</div>
        <div class="brand-sub">Tātaki Auckland Unlimited · Natural Turf Maintenance</div>
      </div>
    </div>
    <nav class="tabs" aria-label="Sections">
      <a href="#dashboard" data-view="dashboard">Dashboard</a>
      <a href="#events" data-view="events">Events</a>
      <a href="#deductions" data-view="deductions">Monthly</a>
      <a href="#bands" data-view="bands">Bands</a>
      <a href="#model" data-view="model">Model</a>
      <a href="#setup" data-view="setup">Setup</a>
    </nav>
    <div class="ctx">
      <select id="contractorSel" aria-label="Contractor"></select>
      <select id="yearSel" aria-label="Contract year"></select>
      <select id="monthSel" aria-label="Month"></select>
    </div>
  </div>
</header>
<main id="app" class="wrap"></main>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="model.js"></script>
<script src="sample.js"></script>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
